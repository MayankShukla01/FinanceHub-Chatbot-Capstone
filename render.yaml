services:
  # ── Backend (FastAPI) ──
  - type: web
    name: financehub-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Frontend (React Static Site) ──
  - type: web
    name: financehub-web
    runtime: static
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
